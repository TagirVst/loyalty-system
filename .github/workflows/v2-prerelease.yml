name: V2 prerelease verification

on:
  push:
    branches: [v2-implementation, v0.1-pre-release]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: loyalty_test
          POSTGRES_PASSWORD: loyalty_test_password
          POSTGRES_DB: loyalty_v2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loyalty_test -d loyalty_v2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      LOYALTY_ENVIRONMENT: test
      LOYALTY_DATABASE_URL: postgresql+asyncpg://loyalty_test:loyalty_test_password@127.0.0.1:5432/loyalty_v2_test
      LOYALTY_TEST_DATABASE_URL: postgresql+asyncpg://loyalty_test:loyalty_test_password@127.0.0.1:5432/loyalty_v2_test
      LOYALTY_PIN_FINGERPRINT_SECRET: test-pin-secret-at-least-32-characters
      LOYALTY_IDENTIFICATION_CODE_SECRET: test-identification-secret-32-characters
      LOYALTY_INTEGRATION_API_KEY_SECRET: test-integration-secret-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements-v2.txt
      - name: Install dependencies
        run: pip install -r requirements-v2.txt
      - name: Compile V2 package
        run: python -m compileall -q src/loyalty_v2 tests_v2
      - name: Apply migrations
        run: alembic -c alembic_v2.ini upgrade head
      - name: Run test suite
        run: pytest -q tests_v2
